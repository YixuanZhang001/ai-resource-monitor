# PricingRegistry 数据源：provider → model → 价格
# unit: per_1m_tokens （每 100 万 token 的价格）
# 价格为公开刊例的近似默认值，请按各 Provider 官网最新价格修正。
# effective_date 用于价格版本管理。

deepseek:
  currency: CNY
  # DeepSeek V4 峰谷（北京时间 UTC+8，无夏令时）：9:00-12:00 / 14:00-18:00 高峰
  peak:
    hours: [[9, 12], [14, 18]]
  models:
    # 2026-08-17 官方价（yuan / 1M tokens）；cache_hit 命中分价；峰谷按 peak.hours
    deepseek-chat:      { input: 1.5,  output: 4.5,  cache_hit: 0.05, peak: { input: 3.0,  output: 9.0,  cache_hit: 0.10 }, effective_date: "2026-08-17" }
    deepseek-reasoner:  { input: 4.5,  output: 13.5, cache_hit: 0.15, peak: { input: 9.0,  output: 27.0, cache_hit: 0.30 }, effective_date: "2026-08-17" }
    # V4 定价：2026-08-17 起峰谷双档（yuan / 1M tokens）
    # 08-17 前单档（命中 0.02 / 未命中 1.0 / 输出 2.0，无峰谷），与平台 CSV 一致
    deepseek-v4-flash:
      - { input: 1.0,  output: 2.0,  cache_hit: 0.02, effective_date: "2025-01-01" }
      - { input: 1.5,  output: 4.5,  cache_hit: 0.05, peak: { input: 3.0, output: 9.0, cache_hit: 0.10 }, effective_date: "2026-08-17" }
    deepseek-v4-pro:
      input: 4.5
      output: 13.5
      cache_hit: 0.15
      peak: { input: 9.0, output: 27.0, cache_hit: 0.30 }
      effective_date: "2026-08-17"

